<!DOCTYPE html>
<html>
<head>
    <title>Video Maker Website</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
</head>
<body>
    <h1>Video Maker Website</h1>
    <div class="uploads">
        <label for="audioInput" class="fileLabel">Choose narration audio</label>
            <input type="file" id="audioInput" accept="audio/*">
        <label for="firstImage" class="fileLabel">Choose first image</label>
            <input type="file" id="firstImage" accept="image/*">

        <label for="lastImage" class="fileLabel">Choose last image</label>
            <input type="file" id="lastImage" accept="image/*">

        <label for="middleFiles" class="fileLabel">Choose photos/videos</label>
            <input type="file" id="middleFiles" accept="video/*,image/*" multiple>
    </div>
    <button id="generateButton">Generate Video</button>
    <p id="status"></p>
    <div id="download">
        <a id="downloadButton" href="#" style="display: none;">Download</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
