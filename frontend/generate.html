<!DOCTYPE html>
<html>
<head>
    <title>Generate Your Video</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
</head>

<body>

    <header class="topBar">
        <span class="siteName">Video Maker</span>
        <nav class="navLinks">
            <a href="/">Home</a>
            <a href="donate">Donate</a>
            <a href="Readme">Learn more</a>
        </nav>
    </header>

    <main class="generate-page">
        <section class="status-panel">

            <div class="state state--ready">
                <p>Your video is ready to put together.</p>
                <button class="btn btn--primary" id="generate-btn">Generate Video</button>
            </div>

            <div class="state state--working" hidden>
                <p>Putting your video together &mdash; this can take a minute&hellip;</p>
                <div class="spinner" aria-hidden="true"></div>
            </div>

            <div class="state state--done" hidden>
                <video
                    class="previw-player"
                    controls
                    preload="metadata"
                    playsinline
                ></video>
                <div class="actions">
                    <a class="btn btn--primary" id="download-link">Download video</a>
                    <a class="btn btn--secondary" href="upload">Make another</a>
                </div>
            </div>

            <div class="state state--error" hidden>
                <p class="error-message"></p>
                <button class="btn btn--secondary" id="retry-btn">Try again</button>
            </div>
        </section>
    </main>

    <footer class="bottomBar">
        <span>&copy; 2026 Vasudev</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
