<!DOCTYPE html>
<html>
<head>
    <title>Support This project</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
</head>

<body>

    <header class="topBar">
        <span class="siteName">Video Maker</span>
        <nav class="navLinks">
            <a href="/">Home</a>
            <a href="donate">Donate</a>
            <a href="Readme">Learn more</a>
        </nav>
    </header>

    <main class="donate-page">
        <section class="donate-card">
            <h1>Enjoyed your video?</h1>
            <p>If this saved you some time , a small tip keeps it running &mdash; totally optional since I do not charge anything! 🥰</p>

            <div class="qr-box">
                <img src="assets/qr-image.jpeg" alt="Scan to pay via GPay" class="qr-image">
            </div>

            <div class="actions">
                <a class="btn btn--primary" href="upi://pay?pa=UPI_ID&pn=Name&cu=INR">Pay with Gpay</a>
                <a class="btn btn--secondary" href="/">No thanks,take me to home</a>
            </div>
        </section>
    </main>

    <footer class="bottomBar">
        <span>&copy;2026 Vasudev</span>
    </footer>
</body>
</html>
